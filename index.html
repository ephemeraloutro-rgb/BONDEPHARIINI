<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BONUS CLAIM — Claim Bonus Sekarang Juga!</title>
<meta name="google-site-verification" content="google5ee1b701fc3092ea" />
<meta name="description" content="Claim bonus harian Anda sekarang juga dengan Spin Wheel Mahjong Ways premium. Masukkan User ID dan putar untuk memenangkan bonus hingga Rp100.000.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Oxanium:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BONUS CLAIM — Galaxy Casino Landing Page
   Single-file HTML/CSS/JS, no frameworks.
   ============================================================ */

:root{
  /* ---- Core palette ---- */
  --bg:            #14040a;
  --mahjong-red:   #C0272D;
  --jade:          #1FAE6B;
  --orange:        #FFA500;
  --gold:          #FFD54A;
  --white:         #FFFFFF;
  --cosmic-purple: #6B22FF;
  --cosmic-blue:   #00C8FF;

  /* ---- Derived tones ---- */
  --mahjong-red-deep:   #4a0a0f;
  --mahjong-red-soft:   rgba(192,39,45,0.35);
  --jade-soft:     rgba(31,174,107,0.25);
  --orange-soft:   rgba(255,165,0,0.35);
  --cosmic-purple-soft: rgba(107,34,255,0.25);
  --cosmic-blue-soft:   rgba(0,200,255,0.25);
  --glass-bg:      rgba(255,255,255,0.05);
  --glass-border:  rgba(255,255,255,0.14);

  /* ---- Fonts ---- */
  --font-display:  'Orbitron', sans-serif;
  --font-body:     'Rajdhani', sans-serif;
  --font-mono:     'Oxanium', sans-serif;

  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 10px;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ overflow-x:hidden; width:100%; }

body{
  background: var(--bg);
  color: var(--white);
  font-family: var(--font-body);
  min-height:100vh;
  position:relative;
  line-height:1.4;
}

/* ============================================================
   BACKGROUND — crossover theme: cosmic astronaut + mahjong dragon
   + Zeus, blended with smooth drifting glow and stars
   ============================================================ */
.bg-layer{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}

/* Ambient cloud glow blobs (cosmic purple/blue blended with red/jade/gold) */
.nebula{
  position:absolute;
  border-radius:50%;
  filter: blur(90px);
  opacity:0.5;
  animation: nebulaDrift 20s ease-in-out infinite alternate;
}
.nebula--1{
  width:60vw; height:60vw; max-width:700px; max-height:700px;
  top:-15%; left:-15%;
  background: radial-gradient(circle, var(--mahjong-red) 0%, transparent 70%);
}
.nebula--2{
  width:55vw; height:55vw; max-width:650px; max-height:650px;
  bottom:-20%; right:-10%;
  background: radial-gradient(circle, var(--jade) 0%, transparent 70%);
  animation-delay: -6s;
}
.nebula--3{
  width:40vw; height:40vw; max-width:500px; max-height:500px;
  top:35%; left:50%; transform:translateX(-50%);
  background: radial-gradient(circle, var(--gold) 0%, transparent 75%);
  opacity:0.25;
  animation-delay: -3s;
}
.nebula--4{
  width:50vw; height:50vw; max-width:600px; max-height:600px;
  top:-10%; right:-18%;
  background: radial-gradient(circle, var(--cosmic-purple) 0%, transparent 72%);
  opacity:0.3;
  animation-delay: -9s;
  animation-duration: 24s;
}
@keyframes nebulaDrift{
  from{ transform: translate(0,0) scale(1); }
  to{ transform: translate(3%, 4%) scale(1.08); }
}

/* Stars */
#starsCanvas{
  position:absolute; inset:0; width:100%; height:100%;
}

/* Floating hero characters — Astronaut / Dragon / Zeus, side by side */
.float-hero{
  position:absolute;
  animation: floatSmooth ease-in-out infinite;
  user-select:none;
  line-height:1;
}
.float-hero--astronaut{
  font-size:130px;
  filter: drop-shadow(0 0 26px var(--cosmic-blue)) drop-shadow(0 0 46px var(--cosmic-purple-soft));
  animation-duration: 9s;
}
.float-hero--dragon{
  font-size:150px;
  filter: drop-shadow(0 0 30px var(--mahjong-red)) drop-shadow(0 0 50px var(--gold));
  animation-duration: 10.5s;
  animation-delay: -3s;
}
.float-hero--zeus{
  font-size:60px;
  filter: drop-shadow(0 0 20px var(--gold)) drop-shadow(0 0 30px var(--white));
  animation-duration: 8.5s;
  animation-delay: -5.5s;
}
.hero-astronaut{ left:-2%; top:10%; opacity:0.9; }
.hero-dragon{    right:-4%; top:16%; opacity:0.9; }
.hero-zeus{      right:5%; top:60%; }

@keyframes floatSmooth{
  0%,100%{ transform: translateY(0) rotate(-3deg); }
  50%{ transform: translateY(-26px) rotate(3deg); }
}

/* Small Mahjong accents filling remaining space */
.float-deco{
  position:absolute;
  font-size:40px;
  animation: floatY 7s ease-in-out infinite;
  opacity:0.75;
  user-select:none;
}
.float-deco--tile{
  filter: drop-shadow(0 0 14px var(--gold));
}
.float-deco--lantern{
  filter: drop-shadow(0 0 16px var(--orange));
}
.float-deco--coin{
  filter: drop-shadow(0 0 12px var(--gold));
  font-size:32px;
}
.deco-1{ left:8%;  top:70%; animation-duration: 7.5s; }
.deco-2{ right:16%; top:10%; animation-duration: 8s;  animation-delay: -3s; }
.deco-3{ left:3%;  top:44%; animation-duration: 6.5s; animation-delay: -1.5s; }
@keyframes floatY{
  0%,100%{ transform: translateY(0) rotate(-4deg); }
  50%{ transform: translateY(-20px) rotate(4deg); }
}
@media (max-width: 760px){
  .float-hero--astronaut{ font-size:70px; }
  .float-hero--dragon{ font-size:80px; }
  .float-hero--zeus{ font-size:30px; }
  .float-hero{ opacity:0.5; }
  .hero-astronaut{ left:-3%; top:4%; }
  .hero-dragon{    right:-5%; top:8%; }
  .hero-zeus{      right:2%; top:78%; }
  .float-deco{ font-size:22px; opacity:0.4; }
  .float-deco--coin{ font-size:18px; }
  .deco-1{ left:4%; top:82%; }
  .deco-2{ right:6%; top:4%; }
  .deco-3{ left:2%; top:48%; }
}

/* ============================================================
   LAYOUT
   ============================================================ */
.page{
  position:relative;
  z-index:1;
  max-width: 560px;
  margin: 0 auto;
  padding: 44px 18px 60px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap: 26px;
}

/* ---- Header ---- */
.header{
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  animation: fadeUp 0.8s ease both;
}

.logo{
  font-family: var(--font-display);
  font-weight:900;
  font-size: clamp(32px, 8vw, 50px);
  letter-spacing: 4px;
  color: var(--white);
  -webkit-text-stroke: 1.4px var(--gold);
  text-stroke: 1.4px var(--gold);
  padding: 14px 34px;
  border: 4px solid var(--gold);
  border-radius: var(--radius-md);
  background: linear-gradient(180deg, rgba(255,213,74,0.16), rgba(255,165,0,0.06));
  text-shadow: 0 0 14px var(--gold), 0 0 28px var(--orange), 0 2px 0 rgba(0,0,0,0.4);
  box-shadow:
    0 0 34px var(--orange-soft),
    inset 0 0 22px rgba(255,213,74,0.12),
    0 0 0 2px var(--bg),
    0 0 0 5px rgba(255,213,74,0.55);
  position:relative;
}
.logo::before{
  content:"👑";
  position:absolute;
  left:50%;
  top:-30px;
  transform: translateX(-50%);
  font-size:30px;
  filter: drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 18px var(--orange));
}
.logo::after{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius: calc(var(--radius-md) + 4px);
  border: 1.5px solid rgba(255,213,74,0.4);
  pointer-events:none;
}

.tagline{
  font-family: var(--font-display);
  font-weight:700;
  font-size: clamp(18px, 5.2vw, 28px);
  color: var(--white);
  letter-spacing: 1px;
  text-shadow:
    0 0 8px var(--orange),
    0 0 18px var(--orange),
    0 0 34px rgba(255,165,0,0.6);
  animation: glowPulseText 2.4s ease-in-out infinite;
}
@keyframes glowPulseText{
  0%,100%{ text-shadow:0 0 8px var(--orange),0 0 18px var(--orange),0 0 34px rgba(255,165,0,0.6); }
  50%{ text-shadow:0 0 14px var(--gold),0 0 28px var(--orange),0 0 46px rgba(255,165,0,0.85); }
}

/* ---- Glass card base ---- */
.glass-card{
  width:100%;
  background: linear-gradient(160deg, var(--glass-bg), rgba(192,39,45,0.07));
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.03) inset,
    0 8px 32px rgba(0,0,0,0.45),
    0 0 40px rgba(0,200,255,0.08);
  padding: 20px;
  animation: fadeUp 0.8s ease both;
}
.card-title{
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 2px;
  color: var(--jade);
  text-shadow: 0 0 10px var(--jade-soft);
  margin-bottom: 14px;
  display:flex;
  align-items:center;
  gap:8px;
}
.card-title::before{
  content:"";
  width:8px; height:8px;
  border-radius:50%;
  background: var(--jade);
  box-shadow: 0 0 10px var(--jade);
  display:inline-block;
}

@keyframes fadeUp{
  from{ opacity:0; transform: translateY(22px); }
  to{ opacity:1; transform: translateY(0); }
}

/* ---- User ID card ---- */
.id-row{
  display:flex;
  gap:10px;
}
.id-input{
  flex:1;
  background: #12061f;
  border: 1.5px solid var(--orange);
  color: var(--white);
  font-family: var(--font-mono);
  font-size:16px;
  letter-spacing:1px;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  outline:none;
  box-shadow: inset 0 0 12px rgba(255,165,0,0.15);
  transition: box-shadow 0.25s ease, border-color 0.25s ease;
  min-width:0;
}
.id-input::placeholder{ color: rgba(255,255,255,0.35); }
.id-input:focus{
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(255,213,74,0.18), inset 0 0 14px rgba(255,165,0,0.25);
}
.btn-hapus{
  font-family: var(--font-display);
  font-weight:700;
  font-size:13px;
  letter-spacing:1px;
  color:#1a0e00;
  background: linear-gradient(180deg, var(--gold), var(--orange));
  border:none;
  border-radius: var(--radius-sm);
  padding: 0 18px;
  cursor:pointer;
  box-shadow: 0 4px 14px rgba(255,165,0,0.4);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  flex-shrink:0;
}
.btn-hapus:hover{ transform: scale(1.05); box-shadow: 0 6px 20px rgba(255,165,0,0.55); }
.btn-hapus:active{ transform: scale(0.97); }

.id-message{
  margin-top: 10px;
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.5px;
  min-height: 18px;
  transition: opacity 0.25s ease;
}
.id-message.error{
  color: #FF6B6B;
  text-shadow: 0 0 8px rgba(255,107,107,0.5);
}
.id-message.success{
  color: var(--gold);
  text-shadow: 0 0 8px rgba(255,213,74,0.5);
}

/* ---- Wheel section ---- */
.wheel-section{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:26px;
  position:relative;
  padding-top: 10px;
}

.wheel-glow-bg{
  position:absolute;
  top:50%; left:50%;
  width:420px; height:420px;
  transform: translate(-50%,-55%);
  background: radial-gradient(circle, rgba(255,165,0,0.35) 0%, transparent 65%);
  filter: blur(20px);
  z-index:0;
  animation: glowPulseBg 3s ease-in-out infinite;
  pointer-events:none;
}
@keyframes glowPulseBg{
  0%,100%{ opacity:0.6; }
  50%{ opacity:1; }
}

.wheel-wrap{
  position:relative;
  width: min(320px, 82vw);
  height: min(320px, 82vw);
  z-index:1;
}

.wheel-ring{
  position:absolute;
  inset:-14px;
  border-radius:50%;
  background: conic-gradient(from 0deg, var(--orange), var(--gold), var(--orange), var(--gold), var(--orange));
  filter: blur(2px);
  box-shadow: 0 0 40px var(--orange), 0 0 80px rgba(255,165,0,0.5);
  animation: ringPulse 2.2s ease-in-out infinite;
}
@keyframes ringPulse{
  0%,100%{ box-shadow: 0 0 30px var(--orange), 0 0 60px rgba(255,165,0,0.45); }
  50%{ box-shadow: 0 0 46px var(--gold), 0 0 90px rgba(255,165,0,0.7); }
}

.pointer{
  position:absolute;
  top:-22px;
  left:50%;
  transform: translateX(-50%);
  width:0; height:0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-top: 30px solid var(--gold);
  filter: drop-shadow(0 0 10px var(--gold));
  z-index:5;
  transform-origin: 50% 0%;
}
.pointer.bounce{
  animation: pointerBounce 0.5s ease;
}
@keyframes pointerBounce{
  0%{ transform: translateX(-50%) translateY(0) rotate(0deg); }
  30%{ transform: translateX(-50%) translateY(6px) rotate(-8deg); }
  60%{ transform: translateX(-50%) translateY(-3px) rotate(6deg); }
  100%{ transform: translateX(-50%) translateY(0) rotate(0deg); }
}

canvas#wheelCanvas{
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;
  z-index:2;
  transition: transform 5.5s cubic-bezier(0.17, 0.67, 0.20, 1);
  box-shadow: 0 0 0 4px #1a0e00, 0 10px 40px rgba(0,0,0,0.6);
}

.wheel-center{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width: 22%;
  height: 22%;
  border-radius:50%;
  background: radial-gradient(circle at 35% 30%, #fff6d6, var(--gold) 45%, var(--orange) 100%);
  box-shadow: 0 0 24px var(--gold), 0 0 50px rgba(255,165,0,0.6), inset 0 -4px 8px rgba(0,0,0,0.35);
  z-index:4;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: var(--font-display);
  font-weight:900;
  color:#3a1a00;
  font-size: 13px;
  letter-spacing:1px;
  text-align:center;
  border: 2px solid rgba(255,255,255,0.5);
}

/* ---- Spin button ---- */
.btn-spin{
  font-family: var(--font-display);
  font-weight:900;
  font-size: 18px;
  letter-spacing: 2px;
  color: #2a1400;
  background: linear-gradient(90deg, var(--gold), var(--orange));
  border:none;
  border-radius: 50px;
  padding: 18px 52px;
  cursor:pointer;
  position:relative;
  box-shadow: 0 0 20px rgba(255,165,0,0.55), 0 8px 24px rgba(0,0,0,0.4);
  transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
  animation: btnGlow 2s ease-in-out infinite;
  width:100%;
  max-width: 320px;
}
@keyframes btnGlow{
  0%,100%{ box-shadow: 0 0 18px rgba(255,165,0,0.5), 0 8px 24px rgba(0,0,0,0.4); }
  50%{ box-shadow: 0 0 34px rgba(255,213,74,0.85), 0 8px 30px rgba(0,0,0,0.45); }
}
.btn-spin:hover:not(:disabled){ transform: scale(1.05); }
.btn-spin:active:not(:disabled){ transform: scale(0.98); }
.btn-spin:disabled{
  opacity:0.6;
  cursor:not-allowed;
  animation:none;
}

/* ---- Sound toggle ---- */
.sound-toggle{
  display:flex;
  align-items:center;
  gap:8px;
  font-family: var(--font-mono);
  font-size:13px;
  color: rgba(255,255,255,0.7);
  user-select:none;
  cursor:pointer;
}
.sound-toggle input{ accent-color: var(--gold); width:16px; height:16px; cursor:pointer; }

/* ---- Recent claim list ---- */
.claim-list{ display:flex; flex-direction:column; gap:10px; transition: opacity 0.35s ease; }
.claim-list.fading{ opacity:0; }
@keyframes claimRowIn{
  from{ opacity:0; transform: translateY(-8px); }
  to{ opacity:1; transform: translateY(0); }
}
.claim-item{
  animation: claimRowIn 0.4s ease both;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-family: var(--font-mono);
}
.claim-name{
  color: var(--white);
  font-weight:600;
  letter-spacing:0.5px;
  display:flex;
  align-items:center;
  gap:8px;
}
.claim-name::before{
  content:"🏆";
  font-size:14px;
}
.claim-amount{
  color: var(--gold);
  font-weight:700;
  text-shadow: 0 0 8px rgba(255,213,74,0.5);
}

/* ---- Popup ---- */
.popup-overlay{
  position:fixed;
  inset:0;
  background: rgba(5,0,15,0.75);
  backdrop-filter: blur(6px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.3s ease;
  padding: 20px;
}
.popup-overlay.show{ opacity:1; pointer-events:auto; }

.popup-card{
  background: linear-gradient(160deg, rgba(30,4,8,0.96), rgba(90,15,20,0.92));
  border: 1.5px solid var(--gold);
  border-radius: var(--radius-lg);
  padding: 36px 30px;
  text-align:center;
  max-width: 340px;
  width:100%;
  box-shadow: 0 0 60px rgba(255,213,74,0.4), 0 20px 60px rgba(0,0,0,0.6);
  transform: scale(0.7) translateY(20px);
  opacity:0;
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s ease;
}
.popup-overlay.show .popup-card{
  transform: scale(1) translateY(0);
  opacity:1;
}
.popup-emoji{ font-size:46px; margin-bottom:10px; filter: drop-shadow(0 0 14px var(--gold)); }
.popup-title{
  font-family: var(--font-display);
  font-weight:900;
  font-size:24px;
  color: var(--white);
  text-shadow: 0 0 14px var(--orange);
  margin-bottom:8px;
  letter-spacing:1px;
}
.popup-sub{
  font-family: var(--font-body);
  font-size:15px;
  color: rgba(255,255,255,0.8);
  margin-bottom:6px;
}
.popup-amount{
  font-family: var(--font-display);
  font-weight:900;
  font-size:34px;
  color: var(--gold);
  text-shadow: 0 0 20px var(--gold), 0 0 40px var(--orange);
  margin: 10px 0 22px;
}
.popup-close{
  font-family: var(--font-display);
  font-weight:700;
  font-size:14px;
  letter-spacing:1px;
  color:#1a0e00;
  background: linear-gradient(90deg, var(--gold), var(--orange));
  border:none;
  border-radius: 50px;
  padding: 12px 34px;
  cursor:pointer;
  box-shadow: 0 0 18px rgba(255,165,0,0.5);
  transition: transform 0.2s ease;
}
.popup-close:hover{ transform: scale(1.05); }

/* ---- Confetti canvas ---- */
#confettiCanvas{
  position:fixed;
  inset:0;
  z-index:110;
  pointer-events:none;
}

/* ---- Footer ---- */
.footer-note{
  text-align:center;
  font-family: var(--font-mono);
  font-size:11px;
  color: rgba(255,255,255,0.35);
  letter-spacing:1px;
  padding-top:6px;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 400px){
  .page{ padding: 36px 12px 44px; gap:20px; }
  .logo{ padding:8px 18px; letter-spacing:2px; }
  .glass-card{ padding:16px; }
  .btn-spin{ padding:16px 30px; font-size:16px; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<!-- ============ BACKGROUND LAYER ============ -->
<div class="bg-layer" aria-hidden="true">
  <canvas id="starsCanvas"></canvas>
  <div class="nebula nebula--1"></div>
  <div class="nebula nebula--2"></div>
  <div class="nebula nebula--3"></div>
  <div class="nebula nebula--4"></div>

  <div class="float-hero float-hero--astronaut hero-astronaut">🧑‍🚀</div>
  <div class="float-hero float-hero--dragon hero-dragon">🐉</div>
  <div class="float-hero float-hero--zeus hero-zeus">⚡</div>

  <div class="float-deco float-deco--tile deco-1">🀄</div>
  <div class="float-deco float-deco--lantern deco-2">🏮</div>
  <div class="float-deco float-deco--coin deco-3">🪙</div>
</div>

<!-- ============ MAIN PAGE ============ -->
<main class="page">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">🀄 BONUS 🀄</div>
    <h1 class="tagline">CLAIM BONUS SEKARANG JUGA!</h1>
  </header>

  <!-- USER ID CARD -->
  <section class="glass-card" aria-label="Masukkan User ID">
    <div class="card-title">MASUKKAN USERID</div>
    <div class="id-row">
      <input type="text" id="userIdInput" class="id-input" placeholder="Contoh: CLAIMBONUS11" autocomplete="off">
      <button class="btn-hapus" id="clearBtn" type="button">HAPUS</button>
    </div>
    <div class="id-message" id="idMessage"></div>
  </section>

  <!-- SPIN WHEEL SECTION -->
  <section class="wheel-section" aria-label="Lucky Spin Wheel">
    <div class="wheel-glow-bg" aria-hidden="true"></div>

    <div class="wheel-wrap">
      <div class="wheel-ring" aria-hidden="true"></div>
      <div class="pointer" id="pointer" aria-hidden="true"></div>
      <canvas id="wheelCanvas" width="640" height="640"></canvas>
      <div class="wheel-center">PUTAR</div>
    </div>

    <button class="btn-spin" id="spinBtn" type="button">PUTAR SEKARANG</button>

    <label class="sound-toggle">
      <input type="checkbox" id="soundToggle">
      Aktifkan efek suara
    </label>
  </section>

  <!-- RECENT CLAIM -->
  <section class="glass-card" aria-label="Recent Claim">
    <div class="card-title">RECENT CLAIM</div>
    <div class="claim-list" id="claimList"></div>
  </section>

  <p class="footer-note">BONUS CLAIM &copy; 2026 — Untuk hiburan semata.</p>
</main>

<!-- ============ WIN POPUP ============ -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-card">
    <div class="popup-emoji">🎉</div>
    <div class="popup-title">SELAMAT!</div>
    <div class="popup-sub">Anda mendapatkan Bonus</div>
    <div class="popup-amount" id="popupAmount">Rp0</div>
    <button class="popup-close" id="popupClose" type="button">TUTUP</button>
  </div>
</div>

<canvas id="confettiCanvas"></canvas>

<script>
/* ============================================================
   BONUS CLAIM — JavaScript
   Sections: Stars bg, Wheel render + spin logic, Popup, Confetti,
   Recent Claim randomizer, Sound (optional), User ID clear.
   ============================================================ */
(function(){
  "use strict";

  /* ---------- Colors (from CSS variables) ---------- */
  const COLORS = {
    orange: '#FFA500',
    yellow: '#FFD54A',
    red:    '#C0272D',
    jade:   '#1FAE6B',
    bg:     '#14040a'
  };

  /* ==========================================================
     1) ANIMATED STARFIELD
     ========================================================== */
  const starsCanvas = document.getElementById('starsCanvas');
  const sctx = starsCanvas.getContext('2d');
  let stars = [];

  function resizeStars(){
    starsCanvas.width = window.innerWidth;
    starsCanvas.height = window.innerHeight;
    const count = Math.floor((window.innerWidth * window.innerHeight) / 5000);
    stars = Array.from({length: count}, () => ({
      x: Math.random() * starsCanvas.width,
      y: Math.random() * starsCanvas.height,
      r: Math.random() * 1.4 + 0.3,
      speed: Math.random() * 0.15 + 0.03,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      phase: Math.random() * Math.PI * 2
    }));
  }

  function drawStars(){
    sctx.clearRect(0,0,starsCanvas.width, starsCanvas.height);
    for(const s of stars){
      s.phase += s.twinkleSpeed;
      const alpha = 0.4 + Math.sin(s.phase) * 0.4;
      sctx.beginPath();
      sctx.fillStyle = `rgba(255,255,255,${Math.max(0.1,alpha)})`;
      sctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      sctx.fill();

      // slow drift (particles)
      s.y += s.speed;
      if(s.y > starsCanvas.height){ s.y = 0; s.x = Math.random()*starsCanvas.width; }
    }
    requestAnimationFrame(drawStars);
  }

  resizeStars();
  window.addEventListener('resize', resizeStars);
  drawStars();

  /* ==========================================================
     2) LUCKY WHEEL
     ========================================================== */
  const prizes = [
    { label: 'Rp30.000', value: 30000 },
    { label: 'Rp40.000', value: 40000 },
    { label: 'Rp50.000', value: 50000 },
    { label: 'Rp60.000', value: 60000 },
    { label: 'Rp70.000', value: 70000 },
    { label: 'Rp80.000', value: 80000 },
    { label: 'Rp90.000', value: 90000 },
    { label: 'Rp100.000', value: 100000 }
  ];

  const wheelColors = [COLORS.red, COLORS.yellow, COLORS.jade, COLORS.orange];

  const wheelCanvas = document.getElementById('wheelCanvas');
  const wctx = wheelCanvas.getContext('2d');
  const WHEEL_SIZE = wheelCanvas.width; // internal resolution (640) scaled by CSS
  const CENTER = WHEEL_SIZE / 2;
  const RADIUS = WHEEL_SIZE / 2 - 6;
  const sliceAngle = (Math.PI * 2) / prizes.length;

  function drawWheel(){
    wctx.clearRect(0,0,WHEEL_SIZE, WHEEL_SIZE);

    prizes.forEach((prize, i) => {
      const startAngle = i * sliceAngle - Math.PI/2; // start at top
      const endAngle = startAngle + sliceAngle;
      const color = wheelColors[i % wheelColors.length];

      // slice
      wctx.beginPath();
      wctx.moveTo(CENTER, CENTER);
      wctx.arc(CENTER, CENTER, RADIUS, startAngle, endAngle);
      wctx.closePath();

      const grad = wctx.createRadialGradient(CENTER, CENTER, RADIUS*0.15, CENTER, CENTER, RADIUS);
      grad.addColorStop(0, shadeColor(color, 25));
      grad.addColorStop(1, color);
      wctx.fillStyle = grad;
      wctx.fill();

      // slice border
      wctx.strokeStyle = 'rgba(255,255,255,0.25)';
      wctx.lineWidth = 2;
      wctx.stroke();

      // text following wheel angle
      const midAngle = startAngle + sliceAngle/2;
      wctx.save();
      wctx.translate(CENTER, CENTER);
      wctx.rotate(midAngle);
      wctx.textAlign = 'right';
      wctx.textBaseline = 'middle';
      wctx.fillStyle = '#FFFFFF';
      wctx.font = '900 30px Rajdhani, sans-serif';
      wctx.shadowColor = 'rgba(0,0,0,0.55)';
      wctx.shadowBlur = 6;
      wctx.fillText(prize.label, RADIUS - 24, 0);
      wctx.restore();
    });

    // outer rim
    wctx.beginPath();
    wctx.arc(CENTER, CENTER, RADIUS, 0, Math.PI*2);
    wctx.lineWidth = 6;
    wctx.strokeStyle = 'rgba(255,213,74,0.9)';
    wctx.stroke();
  }

  function shadeColor(hex, percent){
    const num = parseInt(hex.replace('#',''), 16);
    let r = (num >> 16) + Math.round(255 * (percent/100));
    let g = ((num >> 8) & 0x00FF) + Math.round(255 * (percent/100));
    let b = (num & 0x0000FF) + Math.round(255 * (percent/100));
    r = Math.min(255, Math.max(0,r));
    g = Math.min(255, Math.max(0,g));
    b = Math.min(255, Math.max(0,b));
    return `rgb(${r},${g},${b})`;
  }

  drawWheel();

  /* ---------- Spin logic ---------- */
  const spinBtn = document.getElementById('spinBtn');
  const pointerEl = document.getElementById('pointer');
  const userIdInput = document.getElementById('userIdInput');
  const idMessage = document.getElementById('idMessage');
  let currentRotation = 0;
  let isSpinning = false;

  // Tracks which User IDs have already claimed a bonus (per browser session).
  // One claim allowed per unique ID.
  const claimedIds = new Set();

  function showIdMessage(text, type){
    idMessage.textContent = text;
    idMessage.className = 'id-message' + (type ? ' ' + type : '');
  }

  function pickWinningIndex(){
    return Math.floor(Math.random() * prizes.length);
  }

  function spinWheel(){
    if(isSpinning) return;

    const rawId = userIdInput.value.trim();

    // Require a User ID before spinning
    if(!rawId){
      showIdMessage('⚠️ Masukkan User ID terlebih dahulu!', 'error');
      userIdInput.focus();
      return;
    }

    const normalizedId = rawId.toUpperCase();

    // Block if this ID has already claimed a bonus
    if(claimedIds.has(normalizedId)){
      showIdMessage('⚠️ User ID "' + rawId + '" sudah pernah claim bonus!', 'error');
      return;
    }

    showIdMessage('', '');
    isSpinning = true;
    spinBtn.disabled = true;

    playSpinSound();

    const winningIndex = pickWinningIndex();

    // Angle so that the winning slice center lands under the top pointer.
    // Slice i center (unrotated) sits at angle: -90deg + i*sliceAngle + sliceAngle/2
    const sliceCenterDeg = (winningIndex * 360/prizes.length) + (360/prizes.length)/2;
    // We want (currentVisualAngle + rotation) mod 360 == 0 at pointer (top = 0deg reference already offset in drawWheel by -90deg start)
    const randomExtraSpins = 6 + Math.floor(Math.random() * 5); // 6 to 10 rotations
    const targetRotation = randomExtraSpins * 360 + (360 - sliceCenterDeg);

    const finalRotation = currentRotation + targetRotation;
    currentRotation = finalRotation;

    wheelCanvas.style.transform = `rotate(${finalRotation}deg)`;

    // Wheel transition duration is 5.5s (see CSS). Wait for it, then +1s pause, then show popup.
    setTimeout(() => {
      pointerEl.classList.add('bounce');
      setTimeout(() => pointerEl.classList.remove('bounce'), 550);

      setTimeout(() => {
        showWinPopup(prizes[winningIndex]);
        addRecentClaim(prizes[winningIndex], normalizedId, rawId);

        // Lock this ID so it cannot claim again
        claimedIds.add(normalizedId);
        showIdMessage('✅ User ID "' + rawId + '" berhasil claim bonus. Tidak bisa claim lagi.', 'success');

        isSpinning = false;
        spinBtn.disabled = false;
      }, 1000); // wait 1 second after stopping
    }, 5500);
  }

  spinBtn.addEventListener('click', spinWheel);

  /* ==========================================================
     3) WIN POPUP + CONFETTI
     ========================================================== */
  const popupOverlay = document.getElementById('popupOverlay');
  const popupAmount = document.getElementById('popupAmount');
  const popupClose = document.getElementById('popupClose');

  function showWinPopup(prize){
    popupAmount.textContent = prize.label;
    popupOverlay.classList.add('show');
    launchConfetti();
  }
  popupClose.addEventListener('click', () => {
    popupOverlay.classList.remove('show');
  });
  popupOverlay.addEventListener('click', (e) => {
    if(e.target === popupOverlay) popupOverlay.classList.remove('show');
  });

  const confettiCanvas = document.getElementById('confettiCanvas');
  const cctx = confettiCanvas.getContext('2d');
  let confettiParticles = [];
  let confettiRunning = false;

  function resizeConfetti(){
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeConfetti);
  resizeConfetti();

  function launchConfetti(){
    const colors = [COLORS.red, COLORS.yellow, COLORS.jade, COLORS.orange, '#FFFFFF'];
    confettiParticles = Array.from({length: 140}, () => ({
      x: Math.random() * confettiCanvas.width,
      y: -20 - Math.random() * 200,
      w: Math.random() * 8 + 4,
      h: Math.random() * 12 + 6,
      color: colors[Math.floor(Math.random()*colors.length)],
      speedY: Math.random() * 3 + 2,
      speedX: (Math.random() - 0.5) * 2,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
      life: 0,
      maxLife: 220 + Math.random()*60
    }));
    if(!confettiRunning){
      confettiRunning = true;
      animateConfetti();
    }
  }

  function animateConfetti(){
    cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    let anyAlive = false;

    for(const p of confettiParticles){
      p.life++;
      if(p.life > p.maxLife) continue;
      anyAlive = true;
      p.x += p.speedX;
      p.y += p.speedY;
      p.rotation += p.rotSpeed;

      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rotation * Math.PI/180);
      cctx.fillStyle = p.color;
      cctx.globalAlpha = 1 - (p.life / p.maxLife);
      cctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      cctx.restore();
    }

    if(anyAlive){
      requestAnimationFrame(animateConfetti);
    } else {
      confettiRunning = false;
      cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    }
  }

  /* ==========================================================
     4) RECENT CLAIM — auto-rotating randomized list
     ========================================================== */
  // Pool of fake winner name prefixes used to generate the live-looking list
  const namePool = [
    'RAJ', 'LION', 'DEW', 'ZEUS', 'KING', 'ACE', 'ROYAL', 'GOLD',
    'JACK', 'QUEEN', 'TIGER', 'DRAGON', 'LUCKY', 'STAR', 'NOVA',
    'TITAN', 'RAJA', 'SULTAN', 'BOSS', 'PHOENIX'
  ];

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length -1; i>0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  // Build a fresh set of N fake winners with random names + random prize amounts
  function generateFakeWinners(count){
    const names = shuffle(namePool).slice(0, count);
    return names.map(n => ({
      name: n + '***',
      amount: prizes[Math.floor(Math.random() * prizes.length)].label
    }));
  }

  const claimListEl = document.getElementById('claimList');

  function renderClaimList(list){
    claimListEl.innerHTML = '';
    list.forEach(item => {
      const row = document.createElement('div');
      row.className = 'claim-item';
      row.innerHTML = `
        <span class="claim-name">${item.name}</span>
        <span class="claim-amount">${item.amount}</span>
      `;
      claimListEl.appendChild(row);
    });
  }

  // Fade out -> swap content -> fade in, so each rotation reads as an animation
  function renderClaimListAnimated(list){
    claimListEl.classList.add('fading');
    setTimeout(() => {
      renderClaimList(list);
      claimListEl.classList.remove('fading');
    }, 300);
  }

  // initial list on page load
  renderClaimList(generateFakeWinners(5));

  // Auto-rotate the list every 5 seconds to keep it feeling "live"
  let autoRotateTimer = null;
  function startAutoRotate(){
    if(autoRotateTimer) clearInterval(autoRotateTimer);
    autoRotateTimer = setInterval(() => {
      renderClaimListAnimated(generateFakeWinners(5));
    }, 5000);
  }
  startAutoRotate();

  function addRecentClaim(prize, normalizedId, rawId){
    const displayName = rawId ? maskId(rawId) : 'YOU***';
    const newItem = { name: displayName, amount: prize.label };
    const current = generateFakeWinners(4); // refresh the rest with new fake entries too
    current.unshift(newItem);
    renderClaimListAnimated(current.slice(0,5));
    startAutoRotate(); // reset the 5s timer so the real win stays visible for a full cycle
  }

  function maskId(id){
    if(id.length <= 3) return id + '***';
    return id.slice(0,3).toUpperCase() + '***';
  }

  /* ==========================================================
     5) USER ID INPUT — clear button
     ========================================================== */
  document.getElementById('clearBtn').addEventListener('click', () => {
    userIdInput.value = '';
    userIdInput.focus();
    showIdMessage('', '');
  });

  /* ==========================================================
     6) OPTIONAL SOUND EFFECT (WebAudio, no external files)
     ========================================================== */
  let audioCtx = null;
  function playSpinSound(){
    const enabled = document.getElementById('soundToggle').checked;
    if(!enabled) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const duration = 2.2;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }catch(e){ /* audio not supported — fail silently */ }
  }

})();
</script>
